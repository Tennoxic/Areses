[project]
name = "areses"
version = "0.1.0"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "aiosqlite>=0.20",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "email-validator>=2.2",
    "argon2-cffi>=23.1",
    "httpx>=0.27",
    "curl_cffi>=0.7",
    "feedparser>=6.0",
    "trafilatura>=1.12",
    "readability-lxml>=0.8",
    "playwright>=1.48",
    "nh3>=0.2",
    "defusedxml>=0.7",
    "pywebpush>=2.0",
    "py-vapid>=1.9",
    "cryptography>=48.0.1",
    "urllib3>=2.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[project.scripts]
areses-cli = "app.cli:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
